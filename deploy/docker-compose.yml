services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ZEDAZO_BIND: 0.0.0.0:8080
      ZEDAZO_DATA_DIR: /var/lib/zedazo
      ZEDAZO_STORAGE_MODE: ephemeral
      ZEDAZO_MAX_UPLOAD_BYTES: "52428800"
      ZEDAZO_JOB_RETENTION_HOURS: "24"
      ZEDAZO_AUTH_MODE: disabled
      ZEDAZO_OTEL_ENABLED: "false"
    volumes:
      - zedazo-data:/var/lib/zedazo
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8080
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  zedazo-data:
