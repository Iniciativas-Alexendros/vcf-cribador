# cargo-deny configuration for Zedazo
# Ver ADR-0013 (aceptada) en DECISIONS.md

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = []
# Sin allowlist estricto: el grafo Axum/Tokio crece; se confía en licenses + advisories.
# Workspace crates y deps transitivas permitidas por defecto.
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"